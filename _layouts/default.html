<!DOCTYPE html>
<html lang=en>
<head>
<meta charset=UTF-8 />
<meta name=viewport content="width=device-width, initial-scale=1.0" />
<title>{{ page.title }}</title>
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml" />
<link rel="icon" href="/favicon.png" type="image/png" sizes="32x32" />
<link rel="apple-touch-icon" href="/apple-touch-icon.png" />
<meta name=theme-color content=#0a0a0a />
<link rel=stylesheet href=https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&display=swap />
<style>html,body{margin:0;min-height:100vh;background:#0a0a0a;color:#f4f4f1;}
body{display:flex;justify-content:center;font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace;font-size:14px;line-height:1.6;}
main{max-width:28rem;padding:18vh 24px 96px;text-align:left;}
header{display:flex;align-items:center;justify-content:flex-start;gap:8px;margin:0 0 56px;color:#6e6e6a;}
.logo{width:16px;height:14px;flex:0 0 16px;display:block;image-rendering:pixelated;image-rendering:crisp-edges;}
p{margin:0 0 1.15em;}
a{color:#f4f4f1;text-underline-offset:3px;}
a:hover{color:#fff;}
footer{margin-top:56px;color:#6e6e6a;font-size:13px;}</style>
</head>
<body>{{ content }}</body>
</html>
